<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Bottle Maker</title>
    <link icon rel="icon" type="image/svg+xml" href="/bottle.svg" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        background: #111;
        color: #eee;
      }
      #app {
        display: flex;
        height: 100vh;
      }
      #sidebar {
        width: 320px;
        background: #1a1a1a;
        border-right: 1px solid #333;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        padding: 16px;
      }
      #viewport {
        flex: 1;
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 18px;
        color: #fff;
      }
      .field {
        margin-bottom: 12px;
      }
      .field label {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: #ccc;
        margin-bottom: 4px;
      }
      .field input[type="range"] {
        width: 100%;
      }
      .field input[type="color"] {
        width: 100%;
        height: 36px;
        border: none;
        cursor: pointer;
      }
      .field input[type="text"],
      .field select {
        width: 100%;
        padding: 6px;
        background: #333;
        border: 1px solid #555;
        color: #fff;
        border-radius: 4px;
        font-family: inherit;
      }
      .btn-row {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      button {
        background: #3b82f6;
        border: none;
        color: white;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover {
        background: #2563eb;
      }
      input[type="file"] {
        display: none;
      }
      .section-title {
        font-size: 14px;
        color: #aaa;
        margin: 12px 0 6px;
        border-bottom: 1px solid #333;
        padding-bottom: 4px;
      }
      .checkbox-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        color: #ccc;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="sidebar">
        <h2>Bottle Parameters</h2>
        <div class="btn-row">
          <button id="btnExportGlb">Export GLB</button>
          <button id="btnExportJson">Export JSON</button>
          <button id="btnImportJson">Import JSON</button>
          <input
            type="file"
            id="fileImportJson"
            accept="application/json,.json"
          />
        </div>

        <div class="section-title">Label Options</div>
        <div class="checkbox-row">
          <label for="showLabel">Affix Paper Label</label>
          <input type="checkbox" id="showLabel" />
        </div>
        <div id="labelOptions" style="display: none">
          <div class="field">
            <label>Label Text</label>
            <input type="text" id="labelText" value="Elixir" />
          </div>
          <div class="field">
            <label>Font Style</label>
            <select id="labelFont">
              <option value="fantasy">Medieval (Fantasy)</option>
              <option value="Georgia, serif">Classic (Serif)</option>
              <option value="'Brush Script MT', cursive">
                Script (Cursive)
              </option>
              <option value="'Courier New', monospace">
                Typewriter (Monospace)
              </option>
              <option value="Impact, sans-serif">Bold (Impact)</option>
            </select>
          </div>
          <div class="field">
            <label
              >Font Size (×0.1 mm) <span id="val-labelFontSize">80</span></label
            >
            <input
              type="range"
              id="labelFontSize"
              min="20"
              max="200"
              step="2"
              value="80"
            />
          </div>
          <div class="field">
            <label>Label Height (mm) <span id="val-labelH">18</span></label>
            <input
              type="range"
              id="labelH"
              min="5"
              max="60"
              step="1"
              value="18"
            />
          </div>
          <div class="field">
            <label>Label Wrap Angle <span id="val-labelW">0.80</span></label>
            <input
              type="range"
              id="labelW"
              min="0.1"
              max="1.8"
              step="0.05"
              value="0.80"
            />
          </div>
        </div>

        <div class="section-title">Diameters (mm)</div>
        <div class="field">
          <label>Base Diameter <span id="val-baseD">30</span></label>
          <input
            type="range"
            id="baseD"
            min="1"
            max="100"
            step="1"
            value="30"
          />
        </div>
        <div class="field">
          <label>Middle Diameter <span id="val-middleD">22</span></label>
          <input
            type="range"
            id="middleD"
            min="1"
            max="100"
            step="1"
            value="22"
          />
        </div>
        <div class="field">
          <label>Neck Diameter <span id="val-neckD">11</span></label>
          <input
            type="range"
            id="neckD"
            min="1"
            max="100"
            step="1"
            value="11"
          />
        </div>
        <div class="field">
          <label>Neck Upper Diameter <span id="val-neckUpperD">10</span></label>
          <input
            type="range"
            id="neckUpperD"
            min="1"
            max="100"
            step="1"
            value="10"
          />
        </div>
        <div class="field">
          <label>Lip Diameter <span id="val-lipD">12</span></label>
          <input type="range" id="lipD" min="1" max="100" step="1" value="12" />
        </div>

        <div class="section-title">Heights (mm)</div>
        <div class="field">
          <label>Middle Height <span id="val-middleH">30</span></label>
          <input
            type="range"
            id="middleH"
            min="1"
            max="100"
            step="1"
            value="30"
          />
        </div>
        <div class="field">
          <label>Neck Height <span id="val-neckH">10</span></label>
          <input
            type="range"
            id="neckH"
            min="1"
            max="100"
            step="1"
            value="10"
          />
        </div>
        <div class="field">
          <label>Neck Upper Height <span id="val-neckUpperH">4</span></label>
          <input
            type="range"
            id="neckUpperH"
            min="1"
            max="100"
            step="1"
            value="4"
          />
        </div>
        <div class="field">
          <label>Lip Height <span id="val-lipH">3</span></label>
          <input type="range" id="lipH" min="1" max="100" step="1" value="3" />
        </div>

        <div class="section-title">Wall & Fill</div>
        <div class="field">
          <label>Wall Thickness <span id="val-wall">3</span></label>
          <input type="range" id="wall" min="1" max="30" step="0.5" value="3" />
        </div>
        <div class="field">
          <label>Liquid Fill Height <span id="val-liquidH">30</span></label>
          <input
            type="range"
            id="liquidH"
            min="1"
            max="100"
            step="1"
            value="30"
          />
        </div>
        <div class="field">
          <label>Liquid Density <span id="val-liquidOpacity">0.90</span></label>
          <input
            type="range"
            id="liquidOpacity"
            min="0"
            max="1"
            step="0.01"
            value="0.90"
          />
        </div>
        <div class="field">
          <label>Interior / Liquid Color</label>
          <input type="color" id="liquidColor" value="#d94436" />
        </div>
      </div>
      <div id="viewport"></div>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
      import { GLTFExporter } from "three/examples/jsm/exporters/GLTFExporter.js";
      import { RoomEnvironment } from "three/examples/jsm/environments/RoomEnvironment.js";

      const ids = [
        "baseD",
        "middleD",
        "neckD",
        "neckUpperD",
        "lipD",
        "middleH",
        "neckH",
        "neckUpperH",
        "lipH",
        "wall",
        "liquidH",
        "liquidOpacity",
        "liquidColor",
        "showLabel",
        "labelText",
        "labelFont",
        "labelFontSize",
        "labelH",
        "labelW",
      ];
      const inputs = {};
      ids.forEach((id) => (inputs[id] = document.getElementById(id)));

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x18181c);

      const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
      camera.position.set(0, 50, 120);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.getElementById("viewport").appendChild(renderer.domElement);

      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 30, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      const ambient = new THREE.AmbientLight(0xffffff, 0.2);
      scene.add(ambient);

      const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
      keyLight.position.set(40, 80, 60);
      keyLight.castShadow = true;
      keyLight.shadow.bias = -0.001;
      keyLight.shadow.mapSize.width = 2048;
      keyLight.shadow.mapSize.height = 2048;
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xaaccff, 1.0);
      fillLight.position.set(-40, 50, 30);
      scene.add(fillLight);

      const rimLight = new THREE.DirectionalLight(0xffddbb, 1.5);
      rimLight.position.set(0, 40, -60);
      scene.add(rimLight);

      const grid = new THREE.GridHelper(200, 40, 0x333333, 0x1a1a1a);
      grid.position.y = -0.1;
      scene.add(grid);

      const bottleGroup = new THREE.Group();
      scene.add(bottleGroup);

      let glassMesh, liquidMesh, corkMesh, labelGroup;

      function hash(x, y) {
        let s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
        return s - Math.floor(s);
      }

      function fbm(x, y, octaves) {
        let v = 0,
          a = 0.5,
          f = 1.0;
        for (let i = 0; i < octaves; i++) {
          const ix = Math.floor(x * f);
          const iy = Math.floor(y * f);
          const fx = x * f - ix;
          const fy = y * f - iy;
          const u = fx * fx * (3 - 2 * fx);
          const w = fy * fy * (3 - 2 * fy);
          const n = (a, b) => a + (b - a) * w;
          v +=
            a *
            n(
              n(hash(ix, iy), hash(ix, iy + 1)),
              n(hash(ix + 1, iy), hash(ix + 1, iy + 1)),
            );
          a *= 0.5;
          f *= 2;
        }
        return v;
      }

      function createGlassRoughnessTexture() {
        const w = 1024,
          h = 1024;
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        const img = ctx.createImageData(w, h);
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const n = fbm(x * 0.015, y * 0.015, 4);
            const smudge = Math.sin(x * 0.01) * Math.cos(y * 0.01) * 0.5 + 0.5;
            let v = 15 + n * 35 + smudge * 20;
            v = Math.max(0, Math.min(255, v));
            const i = (y * w + x) * 4;
            img.data[i] = v;
            img.data[i + 1] = v;
            img.data[i + 2] = v;
            img.data[i + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(2, 4);
        return tex;
      }

      function createGlassBumpTexture() {
        const w = 1024,
          h = 1024;
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        const img = ctx.createImageData(w, h);
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const fine = fbm(x * 0.05, y * 0.05, 3);
            const streaks =
              Math.sin(x * 0.03 + fbm(x * 0.01, y * 0.01, 2) * 4) * 0.5 + 0.5;
            let v = 128 + (fine - 0.5) * 8 + (streaks - 0.5) * 12;
            v = Math.max(0, Math.min(255, v));
            const i = (y * w + x) * 4;
            img.data[i] = v;
            img.data[i + 1] = v;
            img.data[i + 2] = v;
            img.data[i + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(2, 4);
        tex.colorSpace = THREE.NoColorSpace;
        return tex;
      }

      function createCorkTexture() {
        const w = 1024,
          h = 1024;
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#a07040";
        ctx.fillRect(0, 0, w, h);
        const img = ctx.getImageData(0, 0, w, h);

        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            const n = fbm(x * 0.08, y * 0.08, 5);
            const grain = (n - 0.5) * 40;
            img.data[i] = Math.max(0, Math.min(255, img.data[i] + grain));
            img.data[i + 1] = Math.max(
              0,
              Math.min(255, img.data[i + 1] + grain * 0.85),
            );
            img.data[i + 2] = Math.max(
              0,
              Math.min(255, img.data[i + 2] + grain * 0.7),
            );
          }
        }

        for (let k = 0; k < 8000; k++) {
          const x = Math.random() * w;
          const y = Math.random() * h;
          const r = 1 + Math.random() * 4;
          const c = [40, 25, 10];
          const a = 0.4 + Math.random() * 0.5;
          for (let dy = -r; dy <= r; dy++) {
            for (let dx = -r; dx <= r; dx++) {
              const px = Math.floor(x + dx),
                py = Math.floor(y + dy);
              if (px < 0 || px >= w || py < 0 || py >= h) continue;
              const d2 = dx * dx + dy * dy;
              if (d2 > r * r) continue;
              const i = (py * w + px) * 4;
              const mix = (1 - d2 / (r * r)) * a;
              img.data[i] = img.data[i] * (1 - mix) + c[0] * mix;
              img.data[i + 1] = img.data[i + 1] * (1 - mix) + c[1] * mix;
              img.data[i + 2] = img.data[i + 2] * (1 - mix) + c[2] * mix;
            }
          }
        }

        ctx.putImageData(img, 0, 0);
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(1, 2);
        return tex;
      }

      function createPaperLabelTexture(
        text,
        font,
        fontSize,
        labelH,
        radiusTop,
        radiusBottom,
        thetaLength,
      ) {
        const avgRadius = (radiusTop + radiusBottom) / 2;
        const arcLength = avgRadius * thetaLength;

        const pxPerMm = 12;
        let texW = Math.max(64, Math.round(arcLength * pxPerMm));
        let texH = Math.max(32, Math.round(labelH * pxPerMm));

        const MAX_TEX = 2048;
        const scale = Math.min(1, MAX_TEX / Math.max(texW, texH));
        texW = Math.max(1, Math.round(texW * scale));
        texH = Math.max(1, Math.round(texH * scale));

        const canvas = document.createElement("canvas");
        canvas.width = texW;
        canvas.height = texH;
        const ctx = canvas.getContext("2d");

        // Base parchment
        ctx.fillStyle = "#c19a6b";
        ctx.fillRect(0, 0, texW, texH);

        // Paper noise
        const img = ctx.getImageData(0, 0, texW, texH);
        for (let i = 0; i < img.data.length; i += 4) {
          const noise = (Math.random() - 0.5) * 25;
          img.data[i] = Math.max(0, Math.min(255, img.data[i] + noise));
          img.data[i + 1] = Math.max(
            0,
            Math.min(255, img.data[i + 1] + noise - 5),
          );
          img.data[i + 2] = Math.max(
            0,
            Math.min(255, img.data[i + 2] + noise - 10),
          );
        }
        ctx.putImageData(img, 0, 0);

        // Aged edges
        const grad = ctx.createRadialGradient(
          texW / 2,
          texH / 2,
          texH / 3,
          texW / 2,
          texH / 2,
          Math.max(texW, texH) / 1.8,
        );
        grad.addColorStop(0, "rgba(0,0,0,0)");
        grad.addColorStop(1, "rgba(50,30,10,0.7)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, texW, texH);

        // Border lines scaled to the label size
        const marginX = Math.max(8, texW * 0.04);
        const marginY = Math.max(8, texH * 0.08);
        ctx.strokeStyle = "rgba(50, 30, 20, 0.8)";
        ctx.lineWidth = Math.max(2, texH * 0.012);
        ctx.strokeRect(
          marginX,
          marginY,
          texW - marginX * 2,
          texH - marginY * 2,
        );
        ctx.lineWidth = Math.max(1, texH * 0.004);
        ctx.strokeRect(
          marginX + texH * 0.01,
          marginY + texH * 0.01,
          texW - (marginX + texH * 0.01) * 2,
          texH - (marginY + texH * 0.01) * 2,
        );

        // Draw text at a real-world size (fontSize ≈ tenths of a millimetre)
        ctx.fillStyle = "#1c1511";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const availWidth = texW - marginX * 2;
        const targetHeight = Math.min(texH * 0.92, fontSize * 0.1 * pxPerMm);

        let currentSize = Math.max(10, targetHeight);
        ctx.font = `bold ${currentSize}px ${font}`;

        while (ctx.measureText(text).width > availWidth && currentSize > 10) {
          currentSize = Math.max(
            10,
            currentSize - Math.max(1, currentSize * 0.03),
          );
          ctx.font = `bold ${currentSize}px ${font}`;
        }

        ctx.fillText(text, texW / 2, texH / 2);

        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = 16;
        return tex;
      }

      const glassRoughTex = createGlassRoughnessTexture();
      const glassBumpTex = createGlassBumpTexture();
      const corkTex = createCorkTexture();

      function getValues() {
        return {
          baseD: +inputs.baseD.value,
          middleD: +inputs.middleD.value,
          neckD: +inputs.neckD.value,
          neckUpperD: +inputs.neckUpperD.value,
          lipD: +inputs.lipD.value,
          middleH: +inputs.middleH.value,
          neckH: +inputs.neckH.value,
          neckUpperH: +inputs.neckUpperH.value,
          lipH: +inputs.lipH.value,
          wall: +inputs.wall.value,
          liquidH: +inputs.liquidH.value,
          liquidOpacity: +inputs.liquidOpacity.value,
          liquidColor: inputs.liquidColor.value,
          showLabel: inputs.showLabel.checked,
          labelText: inputs.labelText.value,
          labelFont: inputs.labelFont.value,
          labelFontSize: +inputs.labelFontSize.value,
          labelH: +inputs.labelH.value,
          labelW: +inputs.labelW.value,
        };
      }

      function setValues(obj) {
        ids.forEach((id) => {
          if (obj[id] !== undefined && inputs[id]) {
            if (inputs[id].type === "checkbox") {
              inputs[id].checked = obj[id];
              if (id === "showLabel") {
                document.getElementById("labelOptions").style.display = obj[id]
                  ? "block"
                  : "none";
              }
            } else {
              inputs[id].value = obj[id];
            }
          }
        });
      }

      function updateLabels(p) {
        Object.keys(p).forEach((key) => {
          if (
            key === "liquidColor" ||
            key === "labelText" ||
            key === "labelFont" ||
            key === "showLabel"
          )
            return;
          const el = document.getElementById("val-" + key);
          if (!el) return;
          if (key === "liquidOpacity" || key === "labelW") {
            el.textContent = p[key].toFixed(2);
          } else {
            el.textContent = p[key];
          }
        });
      }

      function innerRadiusAtY(y, profile) {
        if (y <= profile[0].y) return profile[0].x;
        if (y >= profile[profile.length - 1].y)
          return profile[profile.length - 1].x;
        for (let i = 0; i < profile.length - 1; i++) {
          const a = profile[i],
            b = profile[i + 1];
          if (y >= a.y && y <= b.y) {
            const t = (y - a.y) / (b.y - a.y || 1);
            return a.x + (b.x - a.x) * t;
          }
        }
        return 0;
      }

      function buildBottle() {
        const p = getValues();
        updateLabels(p);

        const rBase = p.baseD / 2;
        const rMid = p.middleD / 2;
        const rNeck = p.neckD / 2;
        const rNeckU = p.neckUpperD / 2;
        const rLip = p.lipD / 2;

        const y0 = 0;
        const y1 = p.middleH;
        const y2 = y1 + p.neckH;
        const y3 = y2 + p.neckUpperH;
        const y4 = y3 + p.lipH;

        const t = Math.min(
          p.wall,
          rBase * 0.95,
          rMid * 0.95,
          rNeck * 0.95,
          rNeckU * 0.95,
          rLip * 0.95,
        );

        const glassPoints = [
          new THREE.Vector2(0, y0),
          new THREE.Vector2(rBase, y0),
          new THREE.Vector2(rMid, y1),
          new THREE.Vector2(rNeck, y2),
          new THREE.Vector2(rNeckU, y3),
          new THREE.Vector2(rLip, y4),
          new THREE.Vector2(Math.max(rLip - t, 0), y4),
          new THREE.Vector2(Math.max(rNeckU - t, 0), y3),
          new THREE.Vector2(Math.max(rNeck - t, 0), y2),
          new THREE.Vector2(Math.max(rMid - t, 0), y1),
          new THREE.Vector2(Math.max(rBase - t, 0), t),
          new THREE.Vector2(0, t),
          new THREE.Vector2(0, y0),
        ];

        const innerProfile = [
          new THREE.Vector2(0, t),
          new THREE.Vector2(Math.max(rBase - t, 0), t),
          new THREE.Vector2(Math.max(rMid - t, 0), y1),
          new THREE.Vector2(Math.max(rNeck - t, 0), y2),
          new THREE.Vector2(Math.max(rNeckU - t, 0), y3),
          new THREE.Vector2(Math.max(rLip - t, 0), y4),
        ];

        if (glassMesh) {
          glassMesh.geometry.dispose();
          bottleGroup.remove(glassMesh);
        }
        if (liquidMesh) {
          liquidMesh.geometry.dispose();
          bottleGroup.remove(liquidMesh);
        }
        if (corkMesh) {
          corkMesh.geometry.dispose();
          bottleGroup.remove(corkMesh);
        }
        if (labelGroup) {
          labelGroup.traverse((child) => {
            if (child.geometry) child.geometry.dispose();
            if (child.material) {
              if (child.material.map) child.material.map.dispose();
              child.material.dispose();
            }
          });
          bottleGroup.remove(labelGroup);
          labelGroup = null;
        }

        // --- Glass shell ---
        const glassGeo = new THREE.LatheGeometry(glassPoints, 20);
        const glassMat = new THREE.MeshPhysicalMaterial({
          color: 0xffffff,
          metalness: 0.1,
          roughness: 0.15,
          roughnessMap: glassRoughTex,
          transmission: 1.0,
          ior: 1.52,
          thickness: 0.2,
          dispersion: 2.0,
          clearcoat: 1.0,
          clearcoatRoughness: 0.05,
          iridescence: 0.15,
          iridescenceIOR: 1.3,
          envMapIntensity: 3.5,
          bumpMap: glassBumpTex,
          bumpScale: 0.008,
          side: THREE.DoubleSide,
          transparent: true,
          depthWrite: false,
        });
        glassMesh = new THREE.Mesh(glassGeo, glassMat);
        glassMesh.renderOrder = 2;
        glassMesh.castShadow = true;
        glassMesh.receiveShadow = true;
        bottleGroup.add(glassMesh);

        // --- Paper Label ---
        if (p.showLabel) {
          labelGroup = new THREE.Group();
          const labelH = Math.min(p.labelH, p.middleH * 0.95);
          const labelYCenter = p.middleH / 2;

          const yTop = labelYCenter + labelH / 2;
          const yBottom = labelYCenter - labelH / 2;

          const tTop = Math.max(0, Math.min(1, yTop / (p.middleH || 1)));
          const tBot = Math.max(0, Math.min(1, yBottom / (p.middleH || 1)));

          const radiusTop = rBase + (rMid - rBase) * tTop + 0.12;
          const radiusBottom = rBase + (rMid - rBase) * tBot + 0.12;

          const thetaLength = Math.PI * p.labelW;
          const thetaStart = -thetaLength / 2;

          const labelGeo = new THREE.CylinderGeometry(
            radiusTop,
            radiusBottom,
            labelH,
            12,
            1,
            true,
            thetaStart,
            thetaLength,
          );

          // Front face (Text side)
          const labelTex = createPaperLabelTexture(
            p.labelText,
            p.labelFont,
            p.labelFontSize,
            labelH,
            radiusTop,
            radiusBottom,
            thetaLength,
          );
          const frontMat = new THREE.MeshStandardMaterial({
            map: labelTex,
            roughness: 0.9,
            metalness: 0.0,
            side: THREE.FrontSide,
            depthWrite: true,
          });
          const frontMesh = new THREE.Mesh(labelGeo, frontMat);

          // Back face (Plain parchment side - blocks text from inside/back view)
          const backMat = new THREE.MeshStandardMaterial({
            color: 0xba9363,
            roughness: 0.95,
            metalness: 0.0,
            side: THREE.BackSide,
            depthWrite: true,
          });
          const backMesh = new THREE.Mesh(labelGeo, backMat);

          labelGroup.add(frontMesh);
          labelGroup.add(backMesh);
          labelGroup.position.y = labelYCenter;
          labelGroup.renderOrder = 3;

          bottleGroup.add(labelGroup);
        }

        // --- Interior colored fill / liquid ---
        const eps = 0.05;
        const liquidBottom = t + eps;
        const liquidTop = Math.min(liquidBottom + p.liquidH, y4);

        const liqPoints = [new THREE.Vector2(0, liquidBottom)];
        const yStep = Math.max(4, (liquidTop - liquidBottom) / 8);
        for (let y = liquidBottom; y <= liquidTop; y += yStep) {
          const r = Math.max(innerRadiusAtY(y, innerProfile) - 0.15, 0);
          liqPoints.push(new THREE.Vector2(r, y));
        }
        const topR = Math.max(
          innerRadiusAtY(liquidTop, innerProfile) - 0.15,
          0,
        );
        liqPoints.push(new THREE.Vector2(topR, liquidTop));
        liqPoints.push(new THREE.Vector2(0, liquidTop));

        const liqGeo = new THREE.LatheGeometry(liqPoints, 20);
        const liqMat = new THREE.MeshPhysicalMaterial({
          color: new THREE.Color(p.liquidColor),
          metalness: 0.05,
          roughness: 0.2,
          transparent: true,
          opacity: p.liquidOpacity,
          side: THREE.DoubleSide,
          depthWrite: false,
        });
        liquidMesh = new THREE.Mesh(liqGeo, liqMat);
        liquidMesh.renderOrder = 1;
        bottleGroup.add(liquidMesh);

        // --- Cork ---
        const innerLipR = Math.max(rLip - t, 0.1);
        const innerNeckR = Math.max(rNeckU - t, 0.1);

        const corkTopR = innerLipR * 1.3;
        const corkBottomR = innerNeckR * 0.95;
        const corkH = Math.max(p.lipH * 3.0, 8);

        const corkBottomY = y4 - corkH * 0.65;
        const corkTopY = corkBottomY + corkH;

        const corkPoints = [];
        const segments = 8;
        for (let i = 0; i <= segments; i++) {
          const v = i / segments;
          const radius = corkBottomR + (corkTopR - corkBottomR) * v;
          const profileR = i === segments ? radius * 0.92 : radius;
          const yPos = corkBottomY + (corkTopY - corkBottomY) * v;
          corkPoints.push(new THREE.Vector2(profileR, yPos));
        }
        corkPoints.push(new THREE.Vector2(0, corkTopY));

        const corkGeo = new THREE.LatheGeometry(corkPoints, 12);
        const corkMat = new THREE.MeshStandardMaterial({
          map: corkTex,
          bumpMap: corkTex,
          bumpScale: 0.08,
          roughness: 1.0,
          metalness: 0.05,
          color: 0xddbb99,
        });
        corkMesh = new THREE.Mesh(corkGeo, corkMat);
        corkMesh.renderOrder = 3;
        corkMesh.castShadow = true;
        corkMesh.receiveShadow = true;
        bottleGroup.add(corkMesh);
      }

      function resize() {
        const el = document.getElementById("viewport");
        const w = el.clientWidth;
        const h = el.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }

      function download(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      document.getElementById("btnExportGlb").addEventListener("click", () => {
        const exporter = new GLTFExporter();

        exporter.parse(
          bottleGroup,
          (gltf) => {
            const blob = new Blob([gltf], { type: "model/gltf-binary" });
            download(blob, "bottle.glb");
          },
          (error) => {
            console.error("GLB export failed:", error);
            alert("GLB export failed. See the console for details.");
          },
          { binary: true, onlyVisible: true },
        );
      });

      document.getElementById("btnExportJson").addEventListener("click", () => {
        const data = JSON.stringify(getValues(), null, 2);
        const blob = new Blob([data], { type: "application/json" });
        download(blob, "bottle.json");
      });

      document.getElementById("btnImportJson").addEventListener("click", () => {
        document.getElementById("fileImportJson").click();
      });

      document
        .getElementById("fileImportJson")
        .addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const obj = JSON.parse(ev.target.result);
              setValues(obj);
              buildBottle();
            } catch (err) {
              alert("Invalid JSON file");
            }
          };
          reader.readAsText(file);
          e.target.value = "";
        });

      inputs.showLabel.addEventListener("change", (e) => {
        document.getElementById("labelOptions").style.display = e.target.checked
          ? "block"
          : "none";
        buildBottle();
      });

      ids.forEach((id) => {
        if (id !== "showLabel") {
          inputs[id].addEventListener("input", buildBottle);
        }
      });

      window.addEventListener("resize", resize);

      resize();
      buildBottle();
      animate();
    </script>
  </body>
</html>
