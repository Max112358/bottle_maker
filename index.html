<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Bottle Maker</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #111; color: #eee; }
    #app { display: flex; height: 100vh; }
    #sidebar { width: 320px; background: #1a1a1a; border-right: 1px solid #333; display: flex; flex-direction: column; overflow-y: auto; padding: 16px; }
    #viewport { flex: 1; position: relative; }
    canvas { display: block; width: 100%; height: 100%; }
    h2 { margin: 0 0 12px; font-size: 18px; color: #fff; }
    .field { margin-bottom: 12px; }
    .field label { display: flex; justify-content: space-between; font-size: 13px; color: #ccc; margin-bottom: 4px; }
    .field input[type="range"] { width: 100%; }
    .field input[type="color"] { width: 100%; height: 36px; border: none; cursor: pointer; }
    .btn-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    button { background: #3b82f6; border: none; color: white; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    button:hover { background: #2563eb; }
    input[type="file"] { display: none; }
    .section-title { font-size: 14px; color: #aaa; margin: 12px 0 6px; border-bottom: 1px solid #333; padding-bottom: 4px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <h2>Bottle Parameters</h2>
      <div class="btn-row">
        <button id="btnExportGlb">Export GLB</button>
        <button id="btnExportJson">Export JSON</button>
        <button id="btnImportJson">Import JSON</button>
        <input type="file" id="fileImportJson" accept="application/json,.json" />
      </div>

      <div class="section-title">Diameters (mm)</div>
      <div class="field">
        <label>Base Diameter <span id="val-baseD">30</span></label>
        <input type="range" id="baseD" min="1" max="100" step="1" value="30" />
      </div>
      <div class="field">
        <label>Middle Diameter <span id="val-middleD">22</span></label>
        <input type="range" id="middleD" min="1" max="100" step="1" value="22" />
      </div>
      <div class="field">
        <label>Neck Diameter <span id="val-neckD">11</span></label>
        <input type="range" id="neckD" min="1" max="100" step="1" value="11" />
      </div>
      <div class="field">
        <label>Neck Upper Diameter <span id="val-neckUpperD">10</span></label>
        <input type="range" id="neckUpperD" min="1" max="100" step="1" value="10" />
      </div>
      <div class="field">
        <label>Lip Diameter <span id="val-lipD">12</span></label>
        <input type="range" id="lipD" min="1" max="100" step="1" value="12" />
      </div>

      <div class="section-title">Heights (mm)</div>
      <div class="field">
        <label>Middle Height <span id="val-middleH">30</span></label>
        <input type="range" id="middleH" min="1" max="100" step="1" value="30" />
      </div>
      <div class="field">
        <label>Neck Height <span id="val-neckH">10</span></label>
        <input type="range" id="neckH" min="1" max="100" step="1" value="10" />
      </div>
      <div class="field">
        <label>Neck Upper Height <span id="val-neckUpperH">4</span></label>
        <input type="range" id="neckUpperH" min="1" max="100" step="1" value="4" />
      </div>
      <div class="field">
        <label>Lip Height <span id="val-lipH">3</span></label>
        <input type="range" id="lipH" min="1" max="100" step="1" value="3" />
      </div>

      <div class="section-title">Wall & Fill</div>
      <div class="field">
        <label>Wall Thickness <span id="val-wall">3</span></label>
        <input type="range" id="wall" min="1" max="30" step="0.5" value="3" />
      </div>
      <div class="field">
        <label>Liquid Fill Height <span id="val-liquidH">30</span></label>
        <input type="range" id="liquidH" min="1" max="100" step="1" value="30" />
      </div>
      <div class="field">
        <label>Liquid Opacity <span id="val-liquidOpacity">0.90</span></label>
        <input type="range" id="liquidOpacity" min="0" max="1" step="0.01" value="0.90" />
      </div>
      <div class="field">
        <label>Interior / Liquid Color</label>
        <input type="color" id="liquidColor" value="#d94436" />
      </div>
    </div>
    <div id="viewport"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const ids = ['baseD','middleD','neckD','neckUpperD','lipD','middleH','neckH','neckUpperH','lipH','wall','liquidH','liquidOpacity','liquidColor'];
    const inputs = {};
    ids.forEach(id => inputs[id] = document.getElementById(id));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202025);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(0, 60, 140);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('viewport').appendChild(renderer.domElement);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 30, 0);
    controls.enableDamping = true;

    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
    keyLight.position.set(40, 80, 60);
    keyLight.castShadow = true;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xcceeff, 0.8);
    fillLight.position.set(-40, 50, 30);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffeedd, 1.0);
    rimLight.position.set(0, 40, -60);
    scene.add(rimLight);

    const grid = new THREE.GridHelper(200, 40, 0x444444, 0x222222);
    scene.add(grid);

    const bottleGroup = new THREE.Group();
    scene.add(bottleGroup);

    let glassMesh, liquidMesh, corkMesh;

    // ---------- Procedural textures ----------

    function hash(x, y) {
      let s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
      return s - Math.floor(s);
    }

    function fbm(x, y, octaves) {
      let v = 0, a = 0.5, f = 1.0;
      for (let i = 0; i < octaves; i++) {
        const ix = Math.floor(x * f);
        const iy = Math.floor(y * f);
        const fx = x * f - ix;
        const fy = y * f - iy;
        const u = fx * fx * (3 - 2 * fx);
        const w = fy * fy * (3 - 2 * fy);
        const n = (a, b) => a + (b - a) * w;
        v += a * n(
          n(hash(ix, iy), hash(ix, iy + 1)),
          n(hash(ix + 1, iy), hash(ix + 1, iy + 1))
        );
        a *= 0.5;
        f *= 2;
      }
      return v;
    }

    function createGlassRoughnessTexture() {
      const w = 1024, h = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      const img = ctx.createImageData(w, h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const n = fbm(x * 0.01, y * 0.02, 4);
          const smudge = Math.sin(x * 0.02) * Math.cos(y * 0.015) * 0.5 + 0.5;
          let v = 225 + (n - 0.5) * 30 - smudge * 25 + (Math.random() - 0.5) * 8;
          v = Math.max(0, Math.min(255, v));
          const i = (y * w + x) * 4;
          img.data[i] = v; img.data[i+1] = v; img.data[i+2] = v; img.data[i+3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 4);
      tex.colorSpace = THREE.NoColorSpace;
      return tex;
    }

    function createGlassBumpTexture() {
      const w = 1024, h = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      const img = ctx.createImageData(w, h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const fine = fbm(x * 0.08, y * 0.08, 3);
          const streaks = Math.sin(x * 0.03 + fbm(x * 0.02, y * 0.02, 2) * 4) * 0.5 + 0.5;
          let v = 128 + (fine - 0.5) * 16 + (streaks - 0.5) * 6;
          v = Math.max(0, Math.min(255, v));
          const i = (y * w + x) * 4;
          img.data[i] = v; img.data[i+1] = v; img.data[i+2] = v; img.data[i+3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 4);
      tex.colorSpace = THREE.NoColorSpace;
      return tex;
    }

    function createCorkTexture() {
      const w = 1024, h = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#b07d4b';
      ctx.fillRect(0, 0, w, h);
      const img = ctx.getImageData(0, 0, w, h);

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          const n = fbm(x * 0.04, y * 0.04, 5);
          const grain = (n - 0.5) * 30;
          img.data[i] = Math.max(0, Math.min(255, img.data[i] + grain));
          img.data[i+1] = Math.max(0, Math.min(255, img.data[i+1] + grain * 0.8));
          img.data[i+2] = Math.max(0, Math.min(255, img.data[i+2] + grain * 0.6));
        }
      }

      for (let k = 0; k < 6000; k++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const r = 1 + Math.random() * 3;
        const dark = Math.random() > 0.5;
        const c = dark ? [60, 40, 20] : [220, 190, 150];
        const a = 0.3 + Math.random() * 0.4;
        for (let dy = -r; dy <= r; dy++) {
          for (let dx = -r; dx <= r; dx++) {
            const px = Math.floor(x + dx), py = Math.floor(y + dy);
            if (px < 0 || px >= w || py < 0 || py >= h) continue;
            const d2 = dx*dx + dy*dy;
            if (d2 > r*r) continue;
            const i = (py * w + px) * 4;
            const mix = (1 - d2 / (r*r)) * a;
            img.data[i] = img.data[i] * (1 - mix) + c[0] * mix;
            img.data[i+1] = img.data[i+1] * (1 - mix) + c[1] * mix;
            img.data[i+2] = img.data[i+2] * (1 - mix) + c[2] * mix;
          }
        }
      }

      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 2);
      return tex;
    }

    const glassRoughTex = createGlassRoughnessTexture();
    const glassBumpTex = createGlassBumpTexture();
    const corkTex = createCorkTexture();

    // ---------- Bottle logic ----------

    function getValues() {
      return {
        baseD: +inputs.baseD.value,
        middleD: +inputs.middleD.value,
        neckD: +inputs.neckD.value,
        neckUpperD: +inputs.neckUpperD.value,
        lipD: +inputs.lipD.value,
        middleH: +inputs.middleH.value,
        neckH: +inputs.neckH.value,
        neckUpperH: +inputs.neckUpperH.value,
        lipH: +inputs.lipH.value,
        wall: +inputs.wall.value,
        liquidH: +inputs.liquidH.value,
        liquidOpacity: +inputs.liquidOpacity.value,
        liquidColor: inputs.liquidColor.value
      };
    }

    function setValues(obj) {
      ids.forEach(id => {
        if (obj[id] !== undefined && inputs[id]) inputs[id].value = obj[id];
      });
    }

    function updateLabels(p) {
      Object.keys(p).forEach(key => {
        if (key === 'liquidColor') return;
        const el = document.getElementById('val-' + key);
        if (!el) return;
        if (key === 'liquidOpacity') {
          el.textContent = p[key].toFixed(2);
        } else {
          el.textContent = p[key];
        }
      });
    }

    function innerRadiusAtY(y, profile) {
      if (y <= profile[0].y) return profile[0].x;
      if (y >= profile[profile.length - 1].y) return profile[profile.length - 1].x;
      for (let i = 0; i < profile.length - 1; i++) {
        const a = profile[i], b = profile[i+1];
        if (y >= a.y && y <= b.y) {
          const t = (y - a.y) / (b.y - a.y || 1);
          return a.x + (b.x - a.x) * t;
        }
      }
      return 0;
    }

    function buildBottle() {
      const p = getValues();
      updateLabels(p);

      const rBase = p.baseD / 2;
      const rMid = p.middleD / 2;
      const rNeck = p.neckD / 2;
      const rNeckU = p.neckUpperD / 2;
      const rLip = p.lipD / 2;

      const y0 = 0;
      const y1 = p.middleH;
      const y2 = y1 + p.neckH;
      const y3 = y2 + p.neckUpperH;
      const y4 = y3 + p.lipH;

      const t = Math.min(
        p.wall,
        rBase * 0.95,
        rMid * 0.95,
        rNeck * 0.95,
        rNeckU * 0.95,
        rLip * 0.95
      );

      const glassPoints = [
        new THREE.Vector2(0, y0),
        new THREE.Vector2(rBase, y0),
        new THREE.Vector2(rMid, y1),
        new THREE.Vector2(rNeck, y2),
        new THREE.Vector2(rNeckU, y3),
        new THREE.Vector2(rLip, y4),
        new THREE.Vector2(Math.max(rLip - t, 0), y4),
        new THREE.Vector2(Math.max(rNeckU - t, 0), y3),
        new THREE.Vector2(Math.max(rNeck - t, 0), y2),
        new THREE.Vector2(Math.max(rMid - t, 0), y1),
        new THREE.Vector2(Math.max(rBase - t, 0), t),
        new THREE.Vector2(0, t),
        new THREE.Vector2(0, y0)
      ];

      const innerProfile = [
        new THREE.Vector2(0, t),
        new THREE.Vector2(Math.max(rBase - t, 0), t),
        new THREE.Vector2(Math.max(rMid - t, 0), y1),
        new THREE.Vector2(Math.max(rNeck - t, 0), y2),
        new THREE.Vector2(Math.max(rNeckU - t, 0), y3),
        new THREE.Vector2(Math.max(rLip - t, 0), y4)
      ];

      if (glassMesh) { glassMesh.geometry.dispose(); bottleGroup.remove(glassMesh); }
      if (liquidMesh) { liquidMesh.geometry.dispose(); bottleGroup.remove(liquidMesh); }
      if (corkMesh) { corkMesh.geometry.dispose(); bottleGroup.remove(corkMesh); }

      // --- Glass shell ---
      const glassGeo = new THREE.LatheGeometry(glassPoints, 96);
      const glassMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0.05,
        roughness: 0.04,
        roughnessMap: glassRoughTex,
        clearcoat: 1.0,
        clearcoatRoughness: 0.03,
        transparent: true,
        opacity: 0.22,
        envMapIntensity: 1.8,
        bumpMap: glassBumpTex,
        bumpScale: 0.003,
        ior: 1.5,
        side: THREE.FrontSide,
        depthWrite: false
      });
      glassMesh = new THREE.Mesh(glassGeo, glassMat);
      glassMesh.renderOrder = 1;
      glassMesh.castShadow = true;
      glassMesh.receiveShadow = true;
      bottleGroup.add(glassMesh);

      // --- Interior colored fill / liquid ---
      const eps = 0.05;
      const liquidBottom = t + eps;
      const liquidTop = Math.min(liquidBottom + p.liquidH, y4);

      const liqPoints = [new THREE.Vector2(0, liquidBottom)];
      for (let y = liquidBottom; y <= liquidTop; y += 1) {
        const r = Math.max(innerRadiusAtY(y, innerProfile) - 0.05, 0);
        liqPoints.push(new THREE.Vector2(r, y));
      }
      const topR = Math.max(innerRadiusAtY(liquidTop, innerProfile) - 0.05, 0);
      liqPoints.push(new THREE.Vector2(topR, liquidTop));
      liqPoints.push(new THREE.Vector2(0, liquidTop));

      const liqGeo = new THREE.LatheGeometry(liqPoints, 96);
      const liqMat = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(p.liquidColor),
        metalness: 0.05,
        roughness: 0.2,
        transparent: true,
        opacity: p.liquidOpacity,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      liquidMesh = new THREE.Mesh(liqGeo, liqMat);
      liquidMesh.renderOrder = 2;
      bottleGroup.add(liquidMesh);

      // --- Cork ---
      const corkTopR = rLip * 0.8;
      const corkBottomR = rLip * 0.45;
      const corkH = Math.max(p.lipH * 2.5, 5);
      const corkGeo = new THREE.CylinderGeometry(corkTopR, corkBottomR, corkH, 48, 1, false);
      const corkMat = new THREE.MeshStandardMaterial({
        map: corkTex,
        bumpMap: corkTex,
        bumpScale: 0.04,
        roughness: 0.9,
        metalness: 0
      });
      corkMesh = new THREE.Mesh(corkGeo, corkMat);
      corkMesh.position.y = y4 + corkH * 0.25;
      corkMesh.castShadow = true;
      bottleGroup.add(corkMesh);
    }

    function resize() {
      const el = document.getElementById('viewport');
      const w = el.clientWidth;
      const h = el.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function download(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    document.getElementById('btnExportGlb').addEventListener('click', () => {
      const exporter = new GLTFExporter();
      exporter.parse(
        bottleGroup,
        (gltf) => {
          const blob = new Blob([gltf], { type: 'application/octet-stream' });
          download(blob, 'bottle.glb');
        },
        { binary: true, onlyVisible: true }
      );
    });

    document.getElementById('btnExportJson').addEventListener('click', () => {
      const data = JSON.stringify(getValues(), null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      download(blob, 'bottle.json');
    });

    document.getElementById('btnImportJson').addEventListener('click', () => {
      document.getElementById('fileImportJson').click();
    });

    document.getElementById('fileImportJson').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const obj = JSON.parse(ev.target.result);
          setValues(obj);
          buildBottle();
        } catch (err) {
          alert('Invalid JSON file');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    ids.forEach(id => {
      inputs[id].addEventListener('input', buildBottle);
    });

    window.addEventListener('resize', resize);

    resize();
    buildBottle();
    animate();
  </script>
</body>
</html>
