<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Bottle Maker</title>
    <link rel="icon" type="image/svg+xml" href="/bottle.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="sidebar">
        <h2>Bottle Parameters</h2>
        <div class="btn-row">
          <button id="btnExportGlb">Export GLB</button>
          <button id="btnExportJson">Export JSON</button>
          <button id="btnImportJson">Import JSON</button>
          <input
            type="file"
            id="fileImportJson"
            accept="application/json,.json"
          />
        </div>
        <div class="count-row">
          Estimated triangles: <span id="triCount">-</span>
        </div>

        <div class="section-title">Mesh Resolution</div>
        <div class="field">
          <label>Glass Sides <span id="val-glassSegs">20</span></label>
          <input
            type="range"
            id="glassSegs"
            min="3"
            max="96"
            step="1"
            value="20"
          />
        </div>
        <div class="field">
          <label>Liquid Sides <span id="val-liquidSegs">20</span></label>
          <input
            type="range"
            id="liquidSegs"
            min="3"
            max="96"
            step="1"
            value="20"
          />
        </div>
        <div class="field">
          <label
            >Liquid Vertical Rings <span id="val-liquidRings">8</span></label
          >
          <input
            type="range"
            id="liquidRings"
            min="2"
            max="40"
            step="1"
            value="8"
          />
        </div>
        <div class="field">
          <label>Label Sides <span id="val-labelSegs">12</span></label>
          <input
            type="range"
            id="labelSegs"
            min="1"
            max="64"
            step="1"
            value="12"
          />
        </div>
        <div class="field">
          <label>Cork Sides <span id="val-corkSegs">12</span></label>
          <input
            type="range"
            id="corkSegs"
            min="3"
            max="64"
            step="1"
            value="12"
          />
        </div>
        <div class="field">
          <label>Cork Height Steps <span id="val-corkRings">8</span></label>
          <input
            type="range"
            id="corkRings"
            min="2"
            max="32"
            step="1"
            value="8"
          />
        </div>

        <div class="section-title">Label Options</div>
        <div class="checkbox-row">
          <label for="showLabel">Affix Paper Label</label>
          <input type="checkbox" id="showLabel" />
        </div>
        <div id="labelOptions" style="display: none">
          <div class="field">
            <label>Label Text</label>
            <input type="text" id="labelText" value="Elixir" />
          </div>
          <div class="field">
            <label>Font Style</label>
            <select id="labelFont">
              <option value="fantasy">Medieval (Fantasy)</option>
              <option value="Georgia, serif">Classic (Serif)</option>
              <option value="'Brush Script MT', cursive">
                Script (Cursive)
              </option>
              <option value="'Courier New', monospace">
                Typewriter (Monospace)
              </option>
              <option value="Impact, sans-serif">Bold (Impact)</option>
            </select>
          </div>
          <div class="field">
            <label
              >Font Size (×0.1 mm) <span id="val-labelFontSize">80</span></label
            >
            <input
              type="range"
              id="labelFontSize"
              min="20"
              max="200"
              step="2"
              value="80"
            />
          </div>
          <div class="field">
            <label>Label Height (mm) <span id="val-labelH">18</span></label>
            <input
              type="range"
              id="labelH"
              min="5"
              max="60"
              step="1"
              value="18"
            />
          </div>
        </div>

        <div class="section-title">Diameters (mm)</div>
        <div class="field">
          <label>Base Diameter <span id="val-baseD">30</span></label>
          <input
            type="range"
            id="baseD"
            min="1"
            max="100"
            step="1"
            value="30"
          />
        </div>
        <div class="field">
          <label>Middle Diameter <span id="val-middleD">22</span></label>
          <input
            type="range"
            id="middleD"
            min="1"
            max="100"
            step="1"
            value="22"
          />
        </div>
        <div class="field">
          <label>Neck Diameter <span id="val-neckD">11</span></label>
          <input
            type="range"
            id="neckD"
            min="1"
            max="100"
            step="1"
            value="11"
          />
        </div>
        <div class="field">
          <label>Neck Upper Diameter <span id="val-neckUpperD">10</span></label>
          <input
            type="range"
            id="neckUpperD"
            min="1"
            max="100"
            step="1"
            value="10"
          />
        </div>
        <div class="field">
          <label>Lip Diameter <span id="val-lipD">12</span></label>
          <input type="range" id="lipD" min="1" max="100" step="1" value="12" />
        </div>

        <div class="section-title">Heights (mm)</div>
        <div class="field">
          <label>Middle Height <span id="val-middleH">30</span></label>
          <input
            type="range"
            id="middleH"
            min="1"
            max="100"
            step="1"
            value="30"
          />
        </div>
        <div class="field">
          <label>Neck Height <span id="val-neckH">10</span></label>
          <input
            type="range"
            id="neckH"
            min="1"
            max="100"
            step="1"
            value="10"
          />
        </div>
        <div class="field">
          <label>Neck Upper Height <span id="val-neckUpperH">4</span></label>
          <input
            type="range"
            id="neckUpperH"
            min="1"
            max="100"
            step="1"
            value="4"
          />
        </div>
        <div class="field">
          <label>Lip Height <span id="val-lipH">3</span></label>
          <input type="range" id="lipH" min="1" max="100" step="1" value="3" />
        </div>

        <div class="section-title">Wall & Fill</div>
        <div class="field">
          <label>Wall Thickness <span id="val-wall">3</span></label>
          <input type="range" id="wall" min="1" max="30" step="0.5" value="3" />
        </div>
        <div class="field">
          <label>Liquid Fill Height <span id="val-liquidH">30</span></label>
          <input
            type="range"
            id="liquidH"
            min="1"
            max="100"
            step="1"
            value="30"
          />
        </div>
        <div class="field">
          <label>Liquid Density <span id="val-liquidOpacity">0.90</span></label>
          <input
            type="range"
            id="liquidOpacity"
            min="0"
            max="1"
            step="0.01"
            value="0.90"
          />
        </div>
        <div class="field">
          <label>Interior / Liquid Color</label>
          <input type="color" id="liquidColor" value="#d94436" />
        </div>
      </div>
      <div id="viewport"></div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
